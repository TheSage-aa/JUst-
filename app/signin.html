<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-cream">
  <div class="t-screen">
    <svg class="t-deco-star" viewBox="0 0 100 100" fill="none" stroke="#c9baa8" stroke-width="3" style="opacity:0.25;">
      <path d="M50 5 L61 38 L96 38 L67 59 L78 92 L50 71 L22 92 L33 59 L4 38 L39 38 Z"/>
    </svg>

    <a class="t-back-btn" href="welcome.html">&larr; Back</a>

    <h1 class="t-form-title">Welcome back</h1>
    <p class="t-form-subtitle">Log in to pick up your streak where you left off.</p>

    <form id="signin-form">
      <div class="t-field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="t-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Your password" required />
      </div>
      <p class="t-form-error" id="form-error" hidden></p>
      <button type="submit" class="t-cta" id="submit-btn">
        Log In
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="t-link-row">
      <a href="signup.html">Don't have an account? Sign up</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const errorEl = document.getElementById("form-error");
    const submitBtn = document.getElementById("submit-btn");

    document.getElementById("signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await apiLogin({ email, password });
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
