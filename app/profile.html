<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-app">
  <div class="app-shell">
    <header class="app-header">
      <a href="profile.html" class="app-header-left">
        <span class="app-avatar js-avatar-initial">P</span>
        <span class="app-wordmark">Saabi</span>
      </a>
      <div class="app-header-right">
        <div class="app-pill streak">🔥 <span class="js-streak-val">0</span></div>
        <button class="app-icon-btn" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="profile-card">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar js-avatar-initial">P</div>
        <div class="lvl-badge">LVL <span id="lvl-num">1</span></div>
      </div>
      <div style="flex:1;">
        <p class="profile-name js-user-name">Padi</p>
        <p class="profile-title">Community Health Champion</p>
        <div class="xp-bar"><div class="xp-bar-fill" id="xp-fill" style="width:0%"></div></div>
        <p class="xp-label" id="xp-label">0 / 1000 XP</p>
      </div>
    </div>

    <div class="stat-row-3">
      <div class="stat-mini">
        <div class="stat-mini-icon">🔥</div>
        <p class="stat-mini-label">Streak</p>
        <p class="stat-mini-value js-streak-val">0</p>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-icon">💬</div>
        <p class="stat-mini-label">Gists</p>
        <p class="stat-mini-value" id="gists-num">0</p>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-icon">🏅</div>
        <p class="stat-mini-label">Badges</p>
        <p class="stat-mini-value" id="badges-num">0</p>
      </div>
    </div>

    <div class="section-row">
      <h2 class="section-title">Your Achievements</h2>
      <a href="badges.html" class="section-link">VIEW ALL</a>
    </div>
    <div class="achv-grid" id="achv-grid" style="margin-bottom:20px;"></div>

    <button class="edit-profile-btn">
      Edit Your Profile
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
  </div>

  <nav class="bottom-nav"><div class="bottom-nav-inner">
    <a href="index.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V6a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v14"/></svg>Learn</a>
    <a href="gist.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg>Gist</a>
    <a href="badges.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>Badges</a>
    <a href="profile.html" class="nav-tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </div></nav>

  <script src="js/auth.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      document.dispatchEvent(new CustomEvent("saabi:user-ready", { detail: user }));

      const xp = user.lessonsCompleted * 75;
      const xpTarget = 1000;

      document.getElementById("lvl-num").textContent = user.level;
      document.getElementById("xp-fill").style.width = Math.min(100, (xp / xpTarget) * 100) + "%";
      document.getElementById("xp-label").textContent = `${xp} / ${xpTarget} XP to Level ${user.level + 1}`;
      document.getElementById("gists-num").textContent = user.stats.gistCount;

      const badges = await apiCall("/badges");
      document.getElementById("badges-num").textContent = badges.filter(b => b.unlocked).length;
      document.getElementById("achv-grid").innerHTML = badges.slice(0, 4).map(b => `
        <div class="achv-card ${b.unlocked ? b.color : "locked"}">
          <div class="achv-icon" style="font-size:22px;">${b.unlocked ? b.emoji : "🔒"}</div>
          <p class="achv-title">${b.title}</p>
          <p class="achv-sub">${b.subtitle}</p>
        </div>
      `).join("");
    })();
  </script>
</body>
</html>
