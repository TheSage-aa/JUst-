<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm your email — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-cream">
  <div class="t-screen" style="align-items:center; text-align:center;">
    <svg class="t-deco-heart" viewBox="0 0 100 90" fill="none" stroke="#c9baa8" stroke-width="3" style="opacity:0.25;">
      <path d="M50 82 C10 55 5 25 28 12 C40 5 50 15 50 25 C50 15 60 5 72 12 C95 25 90 55 50 82 Z"/>
    </svg>

    <div class="t-confirm-icon">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#e8a723" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    </div>

    <h1 class="t-form-title">Confirm your email</h1>
    <p class="t-form-subtitle">
      We sent a confirmation link to <strong id="confirm-email">your email</strong>.
      Click it to activate your account, then come back here.
    </p>

    <button id="confirm-btn" class="t-cta">
      I've confirmed — Continue
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div class="t-link-row">
      <a href="#" id="resend-link">Resend email</a>
    </div>
    <div class="t-link-row">
      <a href="signup.html">Wrong email? Change it</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const auth = getAuth();
    if (auth && auth.email) {
      document.getElementById("confirm-email").textContent = auth.email;
    }

    document.getElementById("confirm-btn").addEventListener("click", () => {
      saveAuth({ confirmed: true });
      window.location.href = "signin.html";
    });

    document.getElementById("resend-link").addEventListener("click", (e) => {
      e.preventDefault();
      const link = e.target;
      link.textContent = "Sent ✓";
      setTimeout(() => { link.textContent = "Resend email"; }, 2500);
    });
  </script>
</body>
</html>
