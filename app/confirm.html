<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm your email — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-cream">
  <div class="t-screen" style="align-items:center; text-align:center;">
    <svg class="t-deco-heart" viewBox="0 0 100 90" fill="none" stroke="#c9baa8" stroke-width="3" style="opacity:0.25;">
      <path d="M50 82 C10 55 5 25 28 12 C40 5 50 15 50 25 C50 15 60 5 72 12 C95 25 90 55 50 82 Z"/>
    </svg>

    <div class="t-confirm-icon">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#e8a723" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    </div>

    <h1 class="t-form-title">Confirm your email</h1>
    <p class="t-form-subtitle">
      Enter the 6-digit code we sent to <strong id="confirm-email">your email</strong>.
    </p>
    <p class="t-form-subtitle" id="dev-code-hint" style="margin-top:-18px; font-size:12px;" hidden></p>

    <form id="confirm-form" style="width:100%; text-align:left;">
      <div class="t-field">
        <label for="code">Verification code</label>
        <input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required style="letter-spacing:0.3em; text-align:center; font-size:20px; font-weight:800;" />
      </div>
      <p class="t-form-error" id="form-error" hidden></p>
      <button type="submit" class="t-cta" id="submit-btn">
        Confirm — Continue
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="t-link-row">
      <a href="signup.html">Wrong email? Change it</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const pending = getPendingSignup();
    if (!pending) {
      window.location.href = "signup.html";
    } else {
      document.getElementById("confirm-email").textContent = pending.email;
      if (pending.devVerificationCode) {
        const hint = document.getElementById("dev-code-hint");
        hint.textContent = `Dev mode (no email service connected yet): your code is ${pending.devVerificationCode}`;
        hint.hidden = false;
      }
    }

    const errorEl = document.getElementById("form-error");
    const submitBtn = document.getElementById("submit-btn");

    document.getElementById("confirm-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.hidden = true;
      submitBtn.disabled = true;

      const code = document.getElementById("code").value.trim();
      try {
        await apiVerify({ userId: pending.userId, code });
        clearPendingSignup();
        window.location.href = "signin.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
