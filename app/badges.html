<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Badges — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-app">
  <div class="app-shell">
    <header class="app-header">
      <a href="profile.html" class="app-header-left">
        <span class="app-avatar js-avatar-initial">P</span>
        <span class="app-wordmark">Saabi</span>
      </a>
      <div class="app-header-right">
        <div class="app-pill streak">🔥 <span class="js-streak-val">0</span></div>
      </div>
    </header>

    <div class="section-row">
      <h1 class="section-title" style="margin:8px 0 4px;">Your Badges</h1>
    </div>
    <p style="color:var(--t-ink-soft); margin:0 0 22px; font-size:14px;">Badges you'd actually be proud to show a friend — not a corporate achievement list.</p>

    <div class="achv-grid" id="achv-grid"></div>
  </div>

  <nav class="bottom-nav"><div class="bottom-nav-inner">
    <a href="index.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V6a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v14"/></svg>Learn</a>
    <a href="gist.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg>Gist</a>
    <a href="badges.html" class="nav-tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>Badges</a>
    <a href="profile.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </div></nav>

  <script src="js/auth.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;
      document.dispatchEvent(new CustomEvent("saabi:user-ready", { detail: user }));

      const badges = await apiCall("/badges");
      document.getElementById("achv-grid").innerHTML = badges.map(b => `
        <div class="achv-card ${b.unlocked ? b.color : "locked"}">
          <div class="achv-icon" style="font-size:24px;">${b.unlocked ? b.emoji : "🔒"}</div>
          <p class="achv-title">${b.title}</p>
          <p class="achv-sub">${b.subtitle}</p>
        </div>
      `).join("");
    })();
  </script>
</body>
</html>
