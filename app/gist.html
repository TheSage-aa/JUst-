<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gist — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-app">
  <div class="app-shell" id="gist-shell">
    <header class="app-header">
      <a href="profile.html" class="app-header-left">
        <span class="app-avatar js-avatar-initial">P</span>
        <span class="app-wordmark">Saabi</span>
      </a>
      <div class="app-header-right">
        <div class="app-pill streak">🔥 <span class="js-streak-val">0</span></div>
        <button class="app-icon-btn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
    </header>

    <div class="gist-progress"><div class="gist-progress-fill" id="gist-progress-fill" style="width:33%"></div></div>

    <div id="chat-log">
      <div class="chat-row">
        <img class="chat-avatar" src="assets/characters/zara_avatar.png" alt="Zara" style="border:2px solid #e0304f;" />
        <div class="chat-bubble">Bestie, drinking salt water does <strong>NOT</strong> cure cholera. 🤦🏾‍♀️</div>
      </div>
      <div class="chat-row">
        <img class="chat-avatar" src="assets/characters/tunde_avatar.png" alt="Tunde" style="border:2px solid #3f9401;" />
        <div class="chat-sticker">
          <img src="assets/characters/tunde_full.png" alt="Tunde giving a thumbs up" />
          <p class="chat-sticker-caption">Yes bro! 🙌 Facts only.</p>
        </div>
      </div>
      <div class="chat-row" id="typing-row">
        <img class="chat-avatar" src="assets/characters/buggy_avatar.png" alt="Buggy" style="border:2px solid #e8a723;" />
        <div class="typing-bubble">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>
      </div>
    </div>

    <div class="response-section" id="response-section">
      <p class="response-label">Choose your response</p>
      <button class="response-option" data-choice="aunt">But my aunt said... 👵🏾 <span>&rsaquo;</span></button>
      <button class="response-option" data-choice="why">Wait, really? Why? 🤔 <span>&rsaquo;</span></button>
    </div>
  </div>

  <nav class="bottom-nav"><div class="bottom-nav-inner">
    <a href="index.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V6a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v14"/></svg>Learn</a>
    <a href="gist.html" class="nav-tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg>Gist</a>
    <a href="badges.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>Badges</a>
    <a href="profile.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </div></nav>

  <script src="js/auth.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    const chatLog = document.getElementById("chat-log");
    const typingRow = document.getElementById("typing-row");
    const responseSection = document.getElementById("response-section");
    const progressFill = document.getElementById("gist-progress-fill");

    function addMessage(avatar, ringColor, name, html) {
      const row = document.createElement("div");
      row.className = "chat-row";
      row.innerHTML = `
        <img class="chat-avatar" src="assets/characters/${avatar}" alt="${name}" style="border:2px solid ${ringColor};" />
        <div class="chat-bubble">${html}</div>
      `;
      chatLog.insertBefore(row, typingRow);
    }

    document.querySelectorAll(".response-option").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".response-option").forEach(b => (b.disabled = true));
        progressFill.style.width = "66%";

        const choice = btn.dataset.choice;
        if (choice === "aunt") {
          addMessage("zara_avatar.png", "#e0304f", "Zara", "I hear you — a lot of us grew up hearing that. But \"always done this way\" doesn't mean medically correct. Let's look at what actually works 👇");
        }

        typingRow.innerHTML = `
          <img class="chat-avatar" src="assets/characters/dr_ayo_avatar.png" alt="Dr. Ayo" style="border:2px solid #2fb0ea;" />
          <div class="chat-bubble">Cholera causes severe dehydration fast. Salt water alone can't treat the infection — you need <strong>oral rehydration solution (ORS)</strong> and proper medical care, especially for kids. 💧</div>
        `;

        setTimeout(() => {
          progressFill.style.width = "100%";
          const count = parseInt(localStorage.getItem("saabi_gist_count") || "0", 10) + 1;
          localStorage.setItem("saabi_gist_count", String(count));
          responseSection.innerHTML = `
            <div style="text-align:center; padding-top:8px;">
              <p style="font-weight:900; font-size:18px; margin:0 0 6px;">🎉 You got the gist!</p>
              <p style="color:var(--t-ink-soft); font-weight:700; margin:0 0 20px;">+10 XP</p>
              <a href="index.html" class="t-cta" style="display:flex;">Back to Learn</a>
            </div>`;
        }, 900);
      });
    });
  </script>
</body>
</html>
