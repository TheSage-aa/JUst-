<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gist — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-app">
  <div class="app-shell" id="gist-shell">
    <header class="app-header">
      <a href="profile.html" class="app-header-left">
        <span class="app-avatar js-avatar-initial">P</span>
        <span class="app-wordmark">Saabi</span>
      </a>
      <div class="app-header-right">
        <div class="app-pill streak">🔥 <span class="js-streak-val">0</span></div>
        <button class="app-icon-btn" aria-label="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
    </header>

    <div class="gist-progress"><div class="gist-progress-fill" id="gist-progress-fill" style="width:10%"></div></div>

    <div id="chat-log"></div>

    <div class="response-section" id="response-section"></div>
  </div>

  <nav class="bottom-nav"><div class="bottom-nav-inner">
    <a href="index.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5V6a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v14"/></svg>Learn</a>
    <a href="gist.html" class="nav-tab active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg>Gist</a>
    <a href="badges.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>Badges</a>
    <a href="profile.html" class="nav-tab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</a>
  </div></nav>

  <script src="js/auth.js"></script>
  <script src="js/chrome.js"></script>
  <script>
    const CHARACTERS = "assets/characters-3d/";
    const EPISODE_ID = "gist-cholera-salt-water";

    const chatLog = document.getElementById("chat-log");
    const responseSection = document.getElementById("response-section");
    const progressFill = document.getElementById("gist-progress-fill");

    function addRow(crewMember, node) {
      const row = document.createElement("div");
      row.className = "chat-row";
      const avatarImg = crewMember ? `<img class="chat-avatar" src="${CHARACTERS}${crewMember.avatar}" alt="${crewMember.name}" style="border:2px solid ${crewMember.color};" />` : "";
      row.innerHTML = avatarImg + node;
      chatLog.appendChild(row);
      return row;
    }

    function messageHTML(msg) {
      if (msg.type === "sticker") {
        return `
          <div class="chat-sticker">
            <img src="${CHARACTERS}${msg.img}" alt="sticker" />
            <p class="chat-sticker-caption">${msg.caption}</p>
          </div>`;
      }
      return `<div class="chat-bubble">${msg.html}</div>`;
    }

    function addTypingRow(crewMember) {
      return addRow(crewMember, `
        <div class="typing-bubble">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>`);
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function playMessages(crew, messages) {
      for (const msg of messages) {
        const speaker = crew[msg.speaker];
        const typingRow = addTypingRow(speaker);
        await wait(700);
        typingRow.remove();
        addRow(speaker, messageHTML(msg));
      }
    }

    function renderChoices(choices, onPick) {
      responseSection.innerHTML = `
        <p class="response-label">Choose your response</p>
        ${choices.map(c => `<button class="response-option" data-choice="${c.id}">${c.label} <span>&rsaquo;</span></button>`).join("")}
      `;
      responseSection.querySelectorAll(".response-option").forEach(btn => {
        btn.addEventListener("click", () => {
          responseSection.querySelectorAll(".response-option").forEach(b => (b.disabled = true));
          onPick(btn.dataset.choice);
        }, { once: true });
      });
    }

    async function run() {
      const user = await requireAuth();
      if (!user) return;
      document.dispatchEvent(new CustomEvent("saabi:user-ready", { detail: user }));

      let episode;
      try {
        episode = await apiCall(`/gist/episodes/${EPISODE_ID}`);
      } catch (err) {
        chatLog.innerHTML = `<p style="padding:20px; color:var(--t-ink-soft);">Couldn't load today's Gist — try again in a moment.</p>`;
        return;
      }

      const { crew, script } = episode;
      progressFill.style.width = "33%";
      await playMessages(crew, script.intro);

      renderChoices(script.choices, async (choiceId) => {
        progressFill.style.width = "66%";
        const followUps = (script.responses && script.responses[choiceId]) || [];
        if (followUps.length) await playMessages(crew, followUps);
        await playMessages(crew, [script.followUp]);

        const result = await apiCall(`/gist/episodes/${EPISODE_ID}/complete`, {
          method: "POST",
          body: JSON.stringify({ choice: choiceId }),
        });

        progressFill.style.width = "100%";
        responseSection.innerHTML = `
          <div style="text-align:center; padding-top:8px;">
            <p style="font-weight:900; font-size:18px; margin:0 0 6px;">🎉 ${script.completion?.title || "You got the gist!"}</p>
            <p style="color:var(--t-ink-soft); font-weight:700; margin:0 0 20px;">+${result.xpEarned} XP</p>
            <a href="index.html" class="t-cta" style="display:flex;">Back to Learn</a>
          </div>`;
      });
    }

    run();
  </script>
</body>
</html>
