<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-cream">
  <div class="t-screen">
    <svg class="t-deco-heart" viewBox="0 0 100 90" fill="none" stroke="#c9baa8" stroke-width="3">
      <path d="M50 82 C10 55 5 25 28 12 C40 5 50 15 50 25 C50 15 60 5 72 12 C95 25 90 55 50 82 Z"/>
    </svg>
    <svg class="t-deco-star" viewBox="0 0 100 100" fill="none" stroke="#c9baa8" stroke-width="3">
      <path d="M50 5 L61 38 L96 38 L67 59 L78 92 L50 71 L22 92 L33 59 L4 38 L39 38 Z"/>
    </svg>

    <div class="t-topbar">
      <p class="t-wordmark">Saabi</p>
      <div class="t-streak-pill">🔥 0</div>
    </div>

    <div class="t-hero">
      <div class="t-hero-card">
        <img src="assets/characters/buggy_happy.png" alt="Buggy, the Saabi mascot" />
      </div>
    </div>

    <div class="t-heading">
      <h1>Abeg, welcome to <span class="accent">Saabi</span>!</h1>
    </div>
    <p class="t-subtitle">Your health bestie, serving the real gist on wellness daily.</p>

    <div class="t-card-row">
      <div class="t-feature-card teal">
        <div class="t-feature-icon teal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
        </div>
        <div class="t-feature-label">DAILY GISTS</div>
      </div>
      <div class="t-feature-card gold">
        <div class="t-feature-icon gold">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>
        </div>
        <div class="t-feature-label">EARN BADGES</div>
      </div>
    </div>

    <a class="t-cta" href="signup.html">
      Get Started
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <div class="t-link-row">
      <a href="signin.html">Already have an account? Log in</a>
    </div>
  </div>
</body>
</html>
