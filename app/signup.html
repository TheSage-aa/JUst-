<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Saabi by LUMA</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body class="theme-cream">
  <div class="t-screen">
    <svg class="t-deco-star" viewBox="0 0 100 100" fill="none" stroke="#c9baa8" stroke-width="3" style="opacity:0.25;">
      <path d="M50 5 L61 38 L96 38 L67 59 L78 92 L50 71 L22 92 L33 59 L4 38 L39 38 Z"/>
    </svg>

    <a class="t-back-btn" href="welcome.html">&larr; Back</a>

    <h1 class="t-form-title">Create your account</h1>
    <p class="t-form-subtitle">Join Saabi and start your first daily gist.</p>

    <form id="signup-form">
      <div class="t-field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="What should we call you?" required />
      </div>
      <div class="t-field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="t-field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="At least 8 characters" minlength="8" required />
      </div>
      <button type="submit" class="t-cta">
        Continue
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="t-link-row">
      <a href="signin.html">Already have an account? Log in</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("signup-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      saveAuth({ name, email, confirmed: false });
      window.location.href = "confirm.html";
    });
  </script>
</body>
</html>
